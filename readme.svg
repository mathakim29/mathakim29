<svg fill="none" viewBox="0 0 600 160" width="600" height="160" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <html xmlns="http://www.w3.org/1999/xhtml" lang="en">
    <head>
      <meta charset="UTF-8" />
      <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{margin:0;padding:0;background:transparent}
        .terminal-box{background-color:#0a0a0a;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;width:600px;height:160px;padding:16px 20px;border:1px solid #1a231e;border-radius:8px;color:#10b981;display:flex;flex-direction:column;justify-content:center;gap:4px}
        .features-list{display:flex;flex-direction:column;gap:2px;font-size:13px;color:#10b981}
        .feature-line{display:flex;align-items:center;gap:10px;padding:5px 8px;border-radius:5px;text-decoration:none;color:inherit;cursor:pointer;border:1px solid transparent;transition:background .15s ease, border-color .15s ease, transform .15s ease, color .15s ease}
        .feature-line:hover,.feature-line:focus-visible{background:#0f1f18;border-color:#14382c;color:#34d399;transform:translateX(3px);outline:none}
        .feature-line:active{transform:translateX(3px) scale(.99)}
        .icon{width:16px;text-align:center;flex-shrink:0;font-size:13px;color:#059669;transition:color .15s ease}
        .feature-line:hover .icon,.feature-line:focus-visible .icon{color:#34d399}
        .dim-text{color:#059669;transition:color .15s ease}
        .feature-line:hover .dim-text,.feature-line:focus-visible .dim-text{color:#6ee7b7}
      </style>
    </head>
    <body>
      <div class="terminal-box">
        <div class="features-list">
          <div class="feature-line">
            <span class="icon" aria-hidden="true">⌘</span>
            <span>stack: <span class="dim-text">Docker, Linux, CLI Tooling</span></span>
          </div>
          <a class="feature-line" href="tel:+15551234567" aria-label="Call +1 (555) 123-4567">
            <span class="icon" aria-hidden="true">☎</span>
            <span>phone: <span class="dim-text">+1 (555) 123-4567</span></span>
          </a>
          <a class="feature-line" href="mailto:dev@example.com" aria-label="Email dev@example.com">
            <span class="icon" aria-hidden="true">✉</span>
            <span>email: <span class="dim-text">dev@example.com</span></span>
          </a>
          <a class="feature-line" href="https://example.com" target="_blank" rel="noopener noreferrer" aria-label="Open example.com">
            <span class="icon" aria-hidden="true">⌂</span>
            <span>website: <span class="dim-text">example.com</span></span>
          </a>
        </div>
      </div>
    </body>
    </html>
  </foreignObject>
</svg>
